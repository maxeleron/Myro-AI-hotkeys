<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myro: AI Hotkeys</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <header>
      <h1>Myro: AI Hotkeys</h1>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-platform="chatgpt">ChatGPT</button>
      <button class="tab-btn" data-platform="gemini">Gemini</button>
      <button class="tab-btn" data-platform="grok">Grok</button>
    </div>

    <main>
      <p class="description">Keyboard shortcuts to accelerate your AI workflow</p>
      <table class="shortcuts-table" id="shortcutsTable">
        <thead>
          <tr>
            <th>Shortcut</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </main>

    <footer>
      <small>Myro AI Hotkeys • v0.0.3</small>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
