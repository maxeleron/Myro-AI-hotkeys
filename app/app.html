<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myro: AI Hotkeys</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <header>
      <h1>Myro: AI Hotkeys</h1>
    </header>
    <main>
      <p class="description">Keyboard shortcuts to accelerate your AI workflow</p>
      <table class="shortcuts-table">
        <thead>
          <tr>
            <th>Shortcut</th>
            <th>Action</th>
            <th>Platforms</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <kbd>Alt</kbd> + <kbd>A</kbd><br>
            </td>
            <td>Switch to next AI model</td>
            <td>ChatGPT, Grok, Gemini</td>
          </tr>
          <tr>
            <td>
              <kbd>Alt</kbd> + <kbd>N</kbd><br>
            </td>
            <td>Start new chat</td>
            <td>ChatGPT, Grok, Gemini</td>
          </tr>
        </tbody>
      </table>
    </main>
    <footer>
    </footer>
    <script src="app.js" defer></script>
  </body>
</html>
